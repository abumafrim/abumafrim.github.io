# MafrimDocs releases.
#
# One place. This feeds two things that must not disagree: the history shown
# on /apps/, and the JSON the application itself reads when someone chooses
# "Check for Updates". Editing this file updates both.
#
# The newest release goes first — the application compares against whichever
# version it finds at the top.

page: https://abumafrim.com/apps/
download: https://github.com/abumafrim/mafrimdocs-releases/releases/latest

releases:
  - version: 0.1.0
    date: October 2026
    notes: >-
      First release. Viewing, annotation, comments with threaded replies, form
      filling, text recognition in 38 languages, page organisation, AES-256
      encryption, and certificate signing with optional trusted timestamps.
